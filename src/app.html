<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inboxed</title>
    <script>
      document.documentElement.dataset.platform = /Mac/.test(navigator.userAgent) ? "mac" : "other";
      // Before the first paint, so the window never flashes the other theme. theme.svelte.ts takes over from here.
      try {
        var chosen = localStorage.getItem("inboxed.theme");
      } catch (e) {}
      document.documentElement.dataset.theme =
        chosen || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
